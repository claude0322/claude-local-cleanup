name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test isolated data only
        run: python -m unittest discover -s tests -v
      - name: Verify CLI
        run: python scripts/cleanup.py --help
      - name: Verify distributable matches source
        run: |
          python scripts/package.py
          git diff --exit-code -- dist
